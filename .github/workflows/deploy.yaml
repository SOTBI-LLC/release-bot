name: Check, Test & Deploy Bots
on:
  push:
    branches: [main, master]
  pull_request:
    types: [opened, synchronize]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with: { node-version: '24' }
      - run: corepack enable
      - run: yarn install --frozen-lockfile
      - run: yarn typecheck
      - run: yarn test:run
      - run: node scripts/check-deployments.mjs

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: [check]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Add a bot here when it is ready for automatic deployment.
        bot: [releasebot, alertbot]
    environment: ${{ matrix.bot }}
    concurrency:
      group: deploy-${{ matrix.bot }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with: { node-version: '24' }
      - run: corepack enable
      - run: yarn install --frozen-lockfile
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/${{ matrix.bot }}
          command: deploy
